<!doctype html>
<html>
  <head>
    <title>welcome to CinnPPY.top!</title>
    	<style>
		body {
			background: url("/background.png");
		}
		header {
			display: grid;
			align-items: center;
			justify-items: center;
			grid-template-columns: auto 60%  auto;
			padding: 10px;
			place-content: center;

		}
		#left-spacer-head {
			place-self: end;
		}
		#right-spacer-head {
			place-self: start;
		}
		#title-head {
			display: grid;
			align-items: center;
			justify-items:center;
			background: url("/title_middle.png");
			width: 100%;
			height: 100%;
		}
		#title-text {
			max-width: 100%;
			transform: translateY(10%);
		}
		#content {
			max-width: 70%;
			margin: auto;
			display: grid;
			grid-template-columns: 1fr 4fr;
			border: 4px ridge #5d0456;
			border-radius: 5px;
			background: url("/wallpaper4.png");
		}
		#content-bar {
			border-right: 4px ridge #5d0456;
			display: grid;
			grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr;
			padding: 5px;
			gap: 5px;
			button {
				height:90px;
				background: no-repeat center/80% url("/bubble.png");
				border: none;
				img {
					max-height: 70px;
					max-width: 150px;
				}
				
			}
		}
		#content-body {
			padding: 5%;
			div { 
				background: #ddaaeeee;
				padding: 1%;
				max-width: 100%;
			}
			h1 {
				color: purple;
				font-family: "Courier New", monospace;
			}
			img {
				max-width: 100%;
			}
		}

	</style>
  </head>
  <body>
	  <header> 
		  <div id=left-spacer-head><img src="/title_left.png"></div> 
		  <div id=title-head><a href='/'><img id=title-text src="/logo.png" alt="CinnPPY.top!"></a></div>
		  <div id=right-spacer-head><img src="/title_right.png"></div>
	  </header>
	  <div id=content>
		<div id=content-bar>
			<button onclick="window.location.href='./blog'"><img src="blog.gif" alt="blog"></button>
			<button onclick="window.location.href='./files'"><img src="files.png" alt="random files from my computer"></button>
			<button onclick="window.location.href='./posts'"><img src="posts.png" alt="posts archive"></button>
		</div>
		<div id=content-body>
			<div> 
				<h1> Rn this div is dedicated to L from deathnote</h1>
				<br>
				<img src="/l3.gif" alt="PicMix edit of L with glitter and stuff">
				<div style="position:relative;padding-bottom:6.93%;height:0;overflow:hidden;max-width:100%;">
</div>
			</div>
		</div>
	  </div>

  </body>
</html>
