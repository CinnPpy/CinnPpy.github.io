<!doctype html>
<html>
  <head>
    <title>Posts!</title>
    	<style>
		body {
			background: url("/background.png");
		}
		header {
			display: grid;
			align-items: center;
			justify-items: center;
			grid-template-columns: auto 60%  auto;
			padding: 10px;
			place-content: center;

		}
		#left-spacer-head {
			place-self: end;
		}
		#right-spacer-head {
			place-self: start;
		}
		#title-head {
			display: grid;
			align-items: center;
			justify-items:center;
			background: url("/title_middle.png");
			width: 100%;
			height: 100%;
		}
		#title-text {
			max-width: 100%;
			transform: translateY(10%);
		}
		#content {
			max-width: 70%;
			margin: auto;
			display: grid;
			grid-template-columns: 5fr;
			border: 4px ridge #5d0456;
			border-radius: 5px;
			background: url("/wallpaper4.png");
		}

	</style>
  </head>
  <body>
	  <header> 
		  <div id=left-spacer-head><img src="/title_left.png"></div> 
		  <div id=title-head><a href='/'><img id=title-text src="/logo.png" alt="CinnPPY.top!"></a></div>
		  <div id=right-spacer-head><img src="/title_right.png"></div>
	  </header>
	  <div id=content>
		<p> there are no posts yet, sorry. </p>
	  </div>

  </body>
</html>
